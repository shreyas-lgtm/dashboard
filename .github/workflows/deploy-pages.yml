name: Deploy dashboard to GitHub Pages

# Builds the Vite app and publishes it to GitHub Pages on every push.
# The Listings view is fully static (reads the committed data/listings.json),
# so no server or secrets are needed — GITHUB_TOKEN handles the deploy.
#
# One-time setup: repo Settings → Pages → "Build and deployment" → Source:
# "GitHub Actions". After that, every push here redeploys the live site.

on:
  push:
    branches:
      - main
      - claude/nifty-wright-GxqKL
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; don't cancel an in-progress run.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Build
        run: npm run build
        env:
          GITHUB_PAGES: 'true'
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
